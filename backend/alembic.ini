# Alembic configuration file
# Used by: alembic upgrade head / alembic revision --autogenerate

[alembic]
# Path to the migrations folder (relative to this file)
script_location = migrations

# We override sqlalchemy.url in env.py using the settings object,
# so this line is just a placeholder — it won't be used directly.
sqlalchemy.url = sqlite:///placeholder.db

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
