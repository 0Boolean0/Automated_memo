<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Prevent browser caching issues on local network -->
    <meta http-equiv="Cache-Control" content="no-cache" />

    <!-- PWA meta tags — allows "Add to Home Screen" on Android Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Description for browser tab -->
    <title>SmartStock</title>

    <!-- Favicon placeholder — replace with your actual icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <!-- React mounts here. Everything is a React component from this point. -->
    <div id="root"></div>

    <!-- Main entry point — Vite resolves this TypeScript file -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
